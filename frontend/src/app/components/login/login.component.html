<div class="min-h-screen bg-slate-100 text-slate-800 flex items-center justify-center p-4 relative">

  <!-- Barra Superior Derecha: Modo Noche / Accesibilidad -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-2">
    <!-- Botón Modo Noche / Modo Claro -->
    <button (click)="a11y.toggleDarkMode()" type="button"
      class="p-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 hover:text-cyan-700 border border-gray-300 shadow-sm flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-cyan-400"
      [attr.aria-label]="a11y.darkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo noche'"
      [title]="a11y.darkMode() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Noche'">
      @if (a11y.darkMode()) {
      <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      } @else {
      <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      }
    </button>

    <!-- Widget de Accesibilidad Universal -->
    <app-accessibility-widget></app-accessibility-widget>
  </div>

  <!-- Tarjeta de Login (Modo Claro / Modo Oscuro) -->
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-xl p-6 sm:p-8 relative z-10">

    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#003a6c] to-[#0d9488] text-white shadow-lg mb-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-wide">Sistema de Almacén</h1>
      <p class="text-slate-500 text-sm mt-1">Ingresa tus credenciales para acceder</p>
    </div>

    @if (errorMessage) {
    <div
      class="bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3 rounded-xl mb-6 flex items-center gap-3">
      <svg class="w-5 h-5 text-rose-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Usuario
          *</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" required
          class="w-full bg-slate-50 border border-gray-300 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all text-sm"
          placeholder="Ej. ADMINISTRA">
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Contraseña
          *</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
            required
            class="w-full bg-slate-50 border border-gray-300 rounded-xl px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all text-sm pr-10"
            placeholder="••••••••">
          <button type="button" (click)="toggleShowPassword()" aria-label="Mostrar u ocultar contraseña"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading" aria-label="Iniciar sesión en el sistema"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-[#003a6c] to-[#0d9488] hover:from-[#002d54] hover:to-[#0f766e] text-white font-bold rounded-xl shadow-lg shadow-[#003a6c]/25 hover:shadow-[#003a6c]/40 transition-all duration-200 text-sm tracking-wide flex items-center justify-center gap-2 cursor-pointer border-0">
        @if (loading) {
        <span>Autenticando...</span>
        } @else {
        <span class="text-white font-bold">Iniciar Sesión</span>
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
        }
      </button>
    </form>
  </div>
</div>
