<div class="flex h-screen w-full bg-slate-100 overflow-hidden relative">

  <!-- Backdrop para dispositivos móviles con fade suave acelerado por hardware -->
  <div (click)="closeSidebar()"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 md:hidden transition-opacity duration-300 ease-in-out"
    [class.opacity-100]="isOpen"
    [class.pointer-events-auto]="isOpen"
    [class.opacity-0]="!isOpen"
    [class.pointer-events-none]="!isOpen"
    aria-hidden="true"></div>

  <!-- Sidebar Izquierdo: Transform hardware-accelerated 60fps -->
  <aside
    class="fixed md:relative inset-y-0 left-0 w-72 bg-white z-50 md:z-40 border-r border-gray-200 shrink-0 shadow-2xl md:shadow-md transition-transform duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] will-change-transform"
    [class.-translate-x-full]="!isOpen"
    [class.translate-x-0]="isOpen"
    [class.md:translate-x-0]="true"
    [class.md:w-72]="isOpen"
    [class.md:w-0]="!isOpen"
    [class.md:border-r]="isOpen"
    [class.md:border-r-0]="!isOpen"
    [class.md:overflow-hidden]="true">

    <div class="w-72 flex flex-col justify-between h-full text-slate-800 whitespace-nowrap">

      <div>
        <div class="p-4 sm:p-5 border-b border-gray-200 flex items-center justify-between bg-slate-50/80">
          <div class="flex items-center gap-3">
            <div>
              <span class="font-bold text-base text-slate-900 block leading-tight">Módulos ERP - Producción</span>
            </div>
          </div>

          <button (click)="closeSidebar()"
            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200 md:hidden cursor-pointer transition-colors"
            aria-label="Cerrar menú lateral">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <nav class="p-3 sm:p-4 space-y-2" aria-label="Navegación de módulos ERP">

          <a routerLink="/erp" (click)="closeOnMobile()"
            routerLinkActive="bg-cyan-100 text-cyan-900 border-cyan-300 font-bold shadow-sm"
            [routerLinkActiveOptions]="{exact: true}" aria-label="Ir al módulo de Notas de Salidas"
            class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all text-slate-700 hover:bg-slate-100 hover:text-slate-900 border border-transparent">
            <div class="p-1.5 rounded-lg bg-slate-100 text-cyan-800 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <span>Notas de Salidas</span>
          </a>

          <a routerLink="/nuevo-registro" (click)="closeOnMobile()"
            routerLinkActive="bg-cyan-100 text-cyan-900 border-cyan-300 font-bold shadow-sm"
            aria-label="Ir al módulo de Nuevo Registro"
            class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all text-slate-700 hover:bg-slate-100 hover:text-slate-900 border border-transparent">
            <div class="p-1.5 rounded-lg bg-slate-100 text-cyan-800 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <span>Nuevo Registro</span>
          </a>
        </nav>
      </div>

      <div class="p-3 sm:p-4 border-t border-gray-200 bg-slate-50/90">
        @if (authService.currentUser(); as user) {
        <div
          class="flex items-center justify-between gap-3 p-2.5 rounded-xl bg-white border border-gray-200 shadow-sm mb-3">
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#003a6c] to-[#0d9488] flex items-center justify-center font-bold text-white text-sm shadow shrink-0">
              {{ user.nombre_completo.substring(0, 1).toUpperCase() }}
            </div>
            <div class="text-left overflow-hidden">
              <div class="text-xs font-bold text-slate-900 truncate max-w-[130px]">{{ user.nombre_completo }}</div>
              <div class="text-[10px] text-cyan-800 uppercase font-bold tracking-wider truncate">{{ user.rol_nombre }}
              </div>
            </div>
          </div>
        </div>

        <button (click)="logout()" aria-label="Cerrar sesión de usuario"
          class="w-full py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all cursor-pointer shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 01-3-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
        } @else {
        <a routerLink="/login" (click)="closeSidebar()" aria-label="Ir a la página de iniciar sesión"
          class="w-full py-2.5 px-4 bg-gradient-to-r from-brandDark to-brandTeal hover:from-blue-700 hover:to-teal-600 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all shadow">
          <span>Iniciar Sesión</span>
        </a>
        }
      </div>

    </div>
  </aside>

  <!-- Contenedor Principal (Navbar + Contenido) -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden relative bg-slate-100">

    <!-- Componente Navbar Separado -->
    <app-navbar></app-navbar>

    <!-- Contenido Dinámico (ng-content) -->
    <main class="flex-1 overflow-y-auto w-full relative pt-3 sm:pt-6 px-1 sm:px-4">
      <ng-content></ng-content>
    </main>

  </div>
</div>
